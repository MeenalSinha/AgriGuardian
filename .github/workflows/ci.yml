name: AgriGuardian CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Build, Lint & Automated Regression Tests
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DEBUG: "false"
      JWT_SECRET_KEY: ci_test_high_entropy_secret_key_minimum_32_chars_ok

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Validate Production Configuration
        run: |
          python -c "from backend.app.core.config import get_settings; from backend.app.core.production_validator import validate_production_configuration; validate_production_configuration(get_settings())"

      - name: Execute Economics Test Suite
        run: |
          python -m pytest tests/economics -v

      - name: Execute Synchronization Test Suite
        run: |
          python -m pytest tests/sync -v

      - name: Execute Security & Hardening Test Suite
        run: |
          python -m pytest tests/security -v

      - name: Execute Full Codebase Regression Suite
        run: |
          python -m pytest tests -v --ignore=tests/integration/test_gnani_live.py

      - name: Verify Database Backup & Restore Integrity
        run: |
          python scripts/backup_database.py
          LATEST_BACKUP=$(ls -t backups/*.db | head -1)
          python scripts/restore_database.py --backup-file "$LATEST_BACKUP" --verify-only


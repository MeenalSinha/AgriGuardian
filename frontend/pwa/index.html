<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#16532d">
  <meta name="description" content="AgriGuardian Offline-First Agricultural Companion">
  <title>AgriGuardian — Farmer Companion (Offline-First)</title>
  <link rel="manifest" href="/pwa/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/pwa/assets/icons/icon-192.svg">
  <link rel="stylesheet" href="/pwa/app.css">
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="brand-row">
      <span class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>
      </span>
      <span class="brand-title">AgriGuardian</span>
    </div>
    <div class="header-controls">
      <button id="btn-lang-toggle" class="lang-toggle" aria-label="Toggle Language">Hindi</button>
    </div>
  </header>

  <!-- Live/Offline Truthful Connectivity Indicator Banner -->
  <div id="offline-indicator-root"></div>

  <!-- Main Scrollable App Container -->
  <main class="main-content">
    <!-- Tab 1: Farmer Dashboard View -->
    <div id="pane-dashboard" class="tab-pane">
      <div id="farmer-dashboard-root"></div>
    </div>

    <!-- Tab 2: Log Farm Activity View -->
    <div id="pane-activity" class="tab-pane" style="display: none;">
      <div id="activity-form-root"></div>
    </div>

    <!-- Tab 3: Crop Disease Leaf Photo & Symptom Capture -->
    <div id="pane-diagnosis" class="tab-pane" style="display: none;">
      <div id="leaf-capture-root"></div>
    </div>

    <!-- Tab 4: Smart Farm Reminders -->
    <div id="pane-reminder" class="tab-pane" style="display: none;">
      <div id="reminder-manager-root"></div>
    </div>

    <!-- Tab 5: Synchronization Center & Conflict Resolver -->
    <div id="pane-sync" class="tab-pane" style="display: none;">
      <div id="sync-center-root"></div>
      <div id="conflict-resolver-root" style="margin-top: 16px;"></div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-tab-btn active" data-tab="dashboard">
      <span class="nav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
      </span>
      <span>Dashboard</span>
    </button>
    <button class="nav-tab-btn" data-tab="activity">
      <span class="nav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 11 11 .9a1 1 0 0 1 .8 1.1l-.66 5a1 1 0 0 1-1 .9H16"/><path d="M16 18h-5"/><path d="M18 5a1 1 0 0 0-1 1v5.5"/><circle cx="7" cy="15" r="5"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="15" r="2"/><path d="M5 21v-3.5"/><path d="M2 13.5V9a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v3.5"/></svg>
      </span>
      <span>Activities</span>
    </button>
    <button class="nav-tab-btn" data-tab="diagnosis">
      <span class="nav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
      </span>
      <span>Diagnosis</span>
    </button>
    <button class="nav-tab-btn" data-tab="reminder">
      <span class="nav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </span>
      <span>Reminders</span>
    </button>
    <button class="nav-tab-btn" data-tab="sync">
      <span class="nav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </span>
      <span>Sync Center</span>
    </button>
  </nav>

  <!-- Main ES Module Bootstrapper -->
  <script type="module" src="/pwa/src/app.js"></script>
</body>
</html>
